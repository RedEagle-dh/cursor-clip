[package]
name = "cursor-clip-bench"
version = "0.0.0"
edition = "2024"
rust-version = "1.92"
license = "GPL-3.0-only"
publish = false
description = "Criterion micro benchmarks for the cursor-clip daemon hot paths"

# Kept out of the root package so its manifest and lockfile (used by the
# offline Flatpak build) never gain benchmark-only dependencies.
[workspace]

[lib]
bench = false

[dependencies]
cursor-clip = { path = "../.." }
bytes = "1"
image = { version = "0.25.10", default-features = false, features = ["png"] }
indexmap = "2.14"
serde_json = "1.0"

[dev-dependencies]
criterion = "0.8.2"

[[bench]]
name = "store"
harness = false

[[bench]]
name = "state"
harness = false

[[bench]]
name = "thumbnail"
harness = false

[[bench]]
name = "ipc"
harness = false
